{% extends "base.html" %}
{% block content %}
<div class="auth-layout">
  <section class="auth-card">
    {% if validlink %}
      <h1>Choose a new password</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="field">New password {{ form.new_password1 }} {{ form.new_password1.errors }}</label>
        <label class="field">Confirm password {{ form.new_password2 }} {{ form.new_password2.errors }}</label>
        <button class="btn" type="submit">Update password</button>
      </form>
    {% else %}
      <h1>This reset link is not valid</h1>
      <p><a href="{% url 'accounts:password_reset' %}">Request a new link</a></p>
    {% endif %}
  </section>
</div>
{% endblock %}
